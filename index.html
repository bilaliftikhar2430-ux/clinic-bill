<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d3fa8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Clinic Bill">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Clinic Bill</title>
<style>
/* Layout: bill only. Final amount + code pinned at top; fee, procedures, discount as one-tap rows; most-used medicines first; picked items pinned at bottom. */
:root {
  --paper: #eef2f7;
  --card: #ffffff;
  --ink: #111a27;
  --muted: #586374;
  --line: #d3dbe6;
  --pen: #1d3fa8;
  --pen-soft: #dde6fb;
  --pen-ink: #ffffff;
  --save: #0f7a4a;
  --danger: #b4232f;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", Roboto, system-ui, -apple-system, sans-serif;
  --font-num: "Atkinson Hyperlegible Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d121a; --card: #18202c; --ink: #edf1f7; --muted: #9aa5b6; --line: #2a3446;
    --pen: #7d9cf5; --pen-soft: #22325a; --pen-ink: #0b1020; --save: #5fd39b; --danger: #f07a83; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0d121a; --card: #18202c; --ink: #edf1f7; --muted: #9aa5b6; --line: #2a3446;
  --pen: #7d9cf5; --pen-soft: #22325a; --pen-ink: #0b1020; --save: #5fd39b; --danger: #f07a83; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { touch-action: manipulation; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 18px;
  padding-left: max(10px, env(safe-area-inset-left, 0px));
  padding-right: max(10px, env(safe-area-inset-right, 0px));
  padding-block: 0 80px;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--pen); outline-offset: 2px; }
.wrap { max-width: 640px; margin: 0 auto; display: grid; gap: 12px; }

.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--paper);
  padding-block: 8px 6px; border-bottom: 2px solid var(--line); display: grid; gap: 2px;
}
.top-row { display: flex; align-items: center; gap: 8px; }
.opd {
  flex: none; padding: 6px 9px; border-radius: 12px; border: 2px solid var(--line); background: var(--card);
  font-family: var(--font-num); font-weight: 700; font-size: 18px; line-height: 1.1; text-align: center;
}
.opd small { display: block; font-family: var(--font-body); font-size: 11px; color: var(--muted); letter-spacing: .06em; }
.total { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; border: 0; background: none; padding: 0; text-align: left; }
.total-num { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 44px; font-weight: 700; line-height: 1; color: var(--pen); }
.code-pill { flex: none; font-family: var(--font-num); font-weight: 700; font-size: 17px; border: 2px solid var(--ink); border-radius: 999px; padding: 2px 9px; }
.new { padding: 13px 13px; border-radius: 14px; border: 0; background: var(--pen); color: var(--pen-ink); font-weight: 700; font-size: 16px; white-space: nowrap; }
.disc-line { font-size: 15px; color: var(--save); font-weight: 700; font-family: var(--font-num); }
.undo { font-size: 15px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.undo button { border: 0; background: none; color: var(--pen); font-weight: 700; text-decoration: underline; padding: 4px; }

.lbl { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; margin: 0 0 5px; }
.row5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
.btn {
  position: relative; min-width: 0; padding: 12px 2px; border-radius: 12px; border: 2px solid var(--line); background: var(--card);
  font-weight: 700; font-size: 16px; line-height: 1.15; text-align: center;
}
.btn small { display: block; font-family: var(--font-num); font-size: 13px; font-weight: 500; color: var(--muted); }
.btn.on { background: var(--pen); border-color: var(--pen); color: var(--pen-ink); }
.btn.on small { color: var(--pen-ink); }
.btn.num { font-family: var(--font-num); font-size: 17px; }
.disc .btn { padding: 10px 2px; font-family: var(--font-num); }
.disc .btn.on { background: var(--save); border-color: var(--save); }
.badge {
  position: absolute; top: -8px; right: -4px; min-width: 26px; height: 26px; padding: 0 5px; border-radius: 13px;
  background: var(--danger); color: #fff; font-family: var(--font-num); font-weight: 700; font-size: 14px;
  display: grid; place-items: center; pointer-events: none;
}

.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
.tile { position: relative; min-width: 0; }
.tile-main {
  width: 100%; height: 100%; min-height: 62px; display: flex; flex-direction: column; justify-content: center;
  gap: 2px; padding: 8px 8px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); text-align: left;
}
.tile-name { font-weight: 700; font-size: 17px; line-height: 1.15; overflow-wrap: break-word; letter-spacing: -0.01em; }
.tile-sub { font-family: var(--font-num); font-size: 13px; color: var(--muted); }
.tile.on .tile-main { background: var(--pen); border-color: var(--pen); color: var(--pen-ink); }
.tile.on .tile-sub { color: var(--pen-ink); }
.minus {
  position: absolute; bottom: 4px; right: 4px; width: 34px; height: 34px; border-radius: 10px; border: 0;
  background: var(--card); color: var(--pen); font-size: 24px; font-weight: 700; line-height: 1;
}
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--line); padding: 4px; border-radius: 14px; }
.tab { padding: 11px 2px; border: 0; border-radius: 10px; background: none; font-weight: 700; font-size: 16px; color: var(--muted); }
.tab.on { background: var(--card); color: var(--ink); }
.search-box { position: relative; }
.search { width: 100%; padding: 13px 46px 13px 14px; font-size: 18px; border-radius: 14px; border: 2px solid var(--line); background: var(--card); }
.search:focus { border-color: var(--pen); outline: none; }
.search-x { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border: 0; background: none; font-size: 24px; color: var(--muted); }
.empty { color: var(--muted); font-size: 15px; margin: 0; }

.bottom {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--card);
  border-top: 2px solid var(--pen); box-shadow: 0 -6px 20px rgb(0 0 0 / 0.12);
  padding-left: max(10px, env(safe-area-inset-left, 0px));
  padding-right: max(10px, env(safe-area-inset-right, 0px));
  padding-top: 8px; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
}
.picked { max-width: 640px; margin: 0 auto; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.picked::-webkit-scrollbar { display: none; }
.pick { flex: none; white-space: nowrap; display: flex; align-items: center; gap: 6px; padding: 6px 2px 6px 10px; border-radius: 10px; background: var(--pen-soft); font-size: 15px; font-weight: 700; }
.pick .amt { font-family: var(--font-num); }
.pick button { border: 0; background: none; color: var(--danger); font-size: 22px; width: 34px; height: 34px; line-height: 1; }
.hint { color: var(--muted); font-size: 15px; padding: 7px 0; white-space: nowrap; }

.scrim { position: fixed; inset: 0; z-index: 10; background: rgb(0 0 0 / 0.45); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 640px; background: var(--card); border-radius: 20px 20px 0 0;
  padding: 16px max(14px, env(safe-area-inset-left, 0px)) calc(16px + env(safe-area-inset-bottom, 0px));
  display: grid; gap: 12px;
}
.sheet h3 { margin: 0; font-size: 22px; }
.sheet p { margin: 0; color: var(--muted); font-size: 15px; }
.quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.quick button { padding: 16px 4px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); font-weight: 700; font-family: var(--font-num); font-size: 18px; }
.quick button small { display: block; font-size: 13px; font-weight: 500; color: var(--muted); }
.amount-in { width: 100%; padding: 16px; font-size: 26px; font-family: var(--font-num); border-radius: 14px; border: 2px solid var(--pen); background: var(--card); }
.two { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; }
.big { padding: 15px 8px; border-radius: 14px; border: 0; background: var(--pen); color: var(--pen-ink); font-weight: 700; font-size: 17px; }
.ghost { padding: 15px 8px; border-radius: 14px; border: 2px solid var(--line); background: var(--card); font-weight: 700; }
@media (prefers-reduced-motion: no-preference) {
  .total-num.bump { animation: bump .25s ease-out; }
  @keyframes bump { from { transform: scale(1.1); } to { transform: scale(1); } }
}
@media (max-width: 360px) { .grid { grid-template-columns: repeat(2, 1fr); } .total-num { font-size: 34px; } .btn { font-size: 14px; } }
</style>

<style>:root { padding-top: env(safe-area-inset-top, 0px); }</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="top-row">
      <button class="opd" id="opd" type="button" aria-label="Patient number"><small>NO.</small><span id="opd-num">1</span></button>
      <button class="total" id="total-btn" type="button" aria-label="Type final amount">
        <span class="total-num" id="total">0</span>
        <span class="code-pill" id="code-pill" hidden></span>
      </button>
      <button class="new" id="clear" type="button">New patient</button>
    </div>
    <div class="disc-line" id="disc-line" hidden></div>
    <div class="undo" id="undo-bar" hidden><span>Cleared.</span><button type="button" id="undo">Undo</button></div>
  </header>

  <section><div class="lbl">Fee</div><div class="row5" id="fee"></div></section>
  <section><div class="lbl">Procedures</div><div class="row5" id="procs"></div></section>
  <section><div class="lbl">Discount %</div><div class="row5 disc" id="disc"></div></section>

  <section style="display:grid;gap:7px">
    <div class="lbl" style="margin:0">Most used</div>
    <div class="grid" id="top-meds"></div>
    <p class="empty" id="top-empty">Medicines you use most will show here by themselves.</p>
  </section>

  <section style="display:grid;gap:7px">
    <div class="lbl" style="margin:0">All medicines</div>
    <div class="search-box">
      <input id="search" class="search" type="search" placeholder="Type to find… (mon, eso)" autocomplete="off">
      <button class="search-x" id="search-x" type="button" aria-label="Clear search" hidden>×</button>
    </div>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="grid" id="meds"></div>
  </section>
</div>

<div class="bottom"><div class="picked" id="picked"></div></div>

<div class="scrim" id="num" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="num-title">
    <h3 id="num-title"></h3>
    <p id="num-note"></p>
    <div class="quick" id="num-quick"></div>
    <input id="num-in" class="amount-in" type="number" inputmode="numeric" placeholder="Type number">
    <div class="two">
      <button class="ghost" id="num-cancel" type="button">Cancel</button>
      <button class="big" id="num-ok" type="button">OK</button>
    </div>
  </div>
</div>

<script>
// ===== Rates (as given by the doctor). perTab items are charged by tablets dispensed. =====
const FEES = [0, 300, 400, 500];
const PROCS = [
  { id: "inj", name: "Inj", price: 150 },
  { id: "drip", name: "Drip", price: 850 },
  { id: "neb", name: "Nebs", price: 200 },
  { id: "dress", name: "Dressing", price: 200 },
];
const DISCOUNTS = [0, 10, 15, 20, 25, 30, 35, 40, 45, 50];
const TABS = [
  { key: "T", title: "Tablets", items: [
    { id: "t-airflow", name: "Airflow", price: 360 },
    { id: "t-ak50", name: "AK 50", price: 75 },
    { id: "t-ak75", name: "AK 75", price: 100 },
    { id: "t-aptizole", name: "Aptizole", price: 295 },
    { id: "t-artilide", name: "Artilide", price: 180 },
    { id: "t-axal", name: "Axal 0.5", perTab: { pack: 238, size: 30, quick: [10, 15, 30] } },
    { id: "t-bactcid", name: "Bactcid", price: 242 },
    { id: "t-bonehealth", name: "Bonehealth", price: 525 },
    { id: "t-cox2", name: "Cox2", price: 270 },
    { id: "t-crn", name: "CRN", price: 439 },
    { id: "t-cyrocin", name: "Cyrocin", price: 230 },
    { id: "t-ferifer", name: "Ferifer F", price: 126 },
    { id: "t-gpep", name: "Gpep", price: 180 },
    { id: "t-iroton", name: "Iroton F", price: 128 },
    { id: "t-lebix", name: "Lebix", price: 213 },
    { id: "t-loxat", name: "Loxat", price: 364 },
    { id: "t-m20", name: "M20", price: 190 },
    { id: "t-ma", name: "MA", price: 50 },
    { id: "t-montekarl", name: "Montekarl", perTab: { pack: 498, size: 14, quick: [7, 14] } },
    { id: "t-montit", name: "Montit", price: 400 },
    { id: "t-recad", name: "Reca D", perTab: { pack: 750, size: 30, quick: [10, 20, 30] } },
    { id: "t-sp", name: "SP", price: 50 },
    { id: "t-voxiquij", name: "Voxiquij", price: 246 },
    { id: "t-zolard", name: "Zolard", price: 352 },
  ]},
  { key: "S", title: "Syrups", items: [
    { id: "s-cefod", name: "Cef OD DS", price: 385 },
    { id: "s-citral", name: "Citral", price: 121 },
    { id: "s-com", name: "COM", price: 49 },
    { id: "s-cyrocin", name: "Cyrocin", price: 314 },
    { id: "s-doncid", name: "Doncid", price: 280 },
    { id: "s-feromalt", name: "Feromalt", price: 250 },
    { id: "s-fevotal", name: "Fevotal 6+", price: 89 },
    { id: "s-fmd", name: "FMD", price: 100 },
    { id: "s-ict", name: "ICT", price: 170 },
    { id: "s-iroton", name: "Iroton", price: 139 },
    { id: "s-mdl", name: "MDL", price: 215 },
    { id: "s-navophen", name: "Navophen", price: 95 },
    { id: "s-nsf", name: "NSF", price: 160 },
    { id: "s-nst60", name: "NST60", price: 55 },
    { id: "s-recad", name: "Reca D", price: 240 },
    { id: "s-s100", name: "S100", price: 100 },
    { id: "s-torax", name: "Torax", price: 160 },
    { id: "s-zysen", name: "Zysen", price: 290 },
  ]},
  { key: "C", title: "Caps", items: [
    { id: "c-esopep20", name: "Esopep 20", price: 70 },
    { id: "c-esopep40", name: "Esopep 40", price: 380 },
    { id: "c-fungicure", name: "Fungicure", price: 220 },
    { id: "c-mobicam", name: "Mobicam", price: 280 },
    { id: "c-protole", name: "Protole", price: 270 },
    { id: "c-rapid", name: "Rapid", price: 280 },
    { id: "c-xi", name: "Xi", price: 250 },
  ]},
  { key: "Inj", title: "Inj +", items: [
    { id: "i-vyber", name: "Vyber", price: 490 },
    { id: "i-esopep", name: "Esopep", price: 450 },
    { id: "i-rapid", name: "Rapid", price: 400 },
    { id: "i-calcif", name: "Calciferol", price: 200 },
    { id: "o-cranberry", name: "Cranberry sachet", price: 350, f: "Sac" },
  ]},
];
const TOP_COUNT = 9;

const ITEMS = {};
TABS.forEach(t => t.items.forEach(it => { if (it.f == null) it.f = t.key; it.tab = t.key; ITEMS[it.id] = it; }));
const lineAmount = (it, q) => it.perTab ? Math.round(it.perTab.pack / it.perTab.size * q) : it.price * q;
const fmt = n => n.toLocaleString("en-US");
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const todayKey = () => { const d = new Date(); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); };
const store = {
  get(k, def) { try { const v = localStorage.getItem(k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
// Doctor's bill code: hundreds as a number, then a letter for the tens (A=10 … I=90). 750 → 7E, 1700 → 17.
const LETTERS = "ABCDEFGHI";
function billCode(amount) {
  const r = Math.round(amount / 10) * 10;
  const h = Math.floor(r / 100), t = (r % 100) / 10;
  return ((h ? String(h) : "") + (t ? LETTERS[t - 1] : "")) || "0";
}

// ===== State =====
const blank = () => ({ fee: null, qty: {}, meds: {}, extras: [], disc: 0, override: null });
let draft = store.get("cb-bill3", null);
let S = draft && draft.day === todayKey() ? Object.assign(blank(), draft.s) : blank();
let opd = store.get("cb-opd", null);
if (!opd || opd.day !== todayKey()) opd = { day: todayKey(), n: 1 };
let usage = store.get("cb-usage", {});       // medicine id -> times used
let lastTabs = store.get("cb-lasttabs", {});  // per-tablet medicine id -> last tablet count
let activeTab = store.get("cb-tab", "T");
if (!TABS.some(t => t.key === activeTab)) activeTab = "T";
let lastCleared = null;
const save = () => { store.set("cb-bill3", { day: todayKey(), s: S }); store.set("cb-opd", opd); };

// ===== Number sheet =====
const numSheet = document.getElementById("num"), numIn = document.getElementById("num-in");
let numDone = null;
function askNumber({ title, note, quick = [], value, onPick }) {
  document.getElementById("num-title").textContent = title;
  const n = document.getElementById("num-note"); n.textContent = note || ""; n.hidden = !note;
  const q = document.getElementById("num-quick");
  q.replaceChildren(...quick.map(o => { const b = el("button", null, o.label); b.type = "button"; if (o.sub) b.append(el("small", null, o.sub)); b.addEventListener("click", () => { onPick(o.value); numSheet.hidden = true; }); return b; }));
  q.hidden = quick.length === 0;
  numIn.value = value != null ? value : ""; numDone = onPick; numSheet.hidden = false;
  if (!quick.length) setTimeout(() => numIn.focus(), 50);
}
function numSubmit() { const v = parseInt(numIn.value, 10); if (!Number.isFinite(v) || v < 0) { numIn.focus(); return; } numDone && numDone(v); numSheet.hidden = true; }
document.getElementById("num-ok").addEventListener("click", numSubmit);
document.getElementById("num-cancel").addEventListener("click", () => { numSheet.hidden = true; });
numIn.addEventListener("keydown", e => { if (e.key === "Enter") numSubmit(); });
numSheet.addEventListener("click", e => { if (e.target === numSheet) numSheet.hidden = true; });

// ===== Fee / procedures / discount =====
const feeBox = document.getElementById("fee");
const feeBtns = FEES.map(v => {
  const b = el("button", "btn num", v === 0 ? "Free" : String(v)); b.type = "button";
  b.addEventListener("click", () => { S.fee = S.fee === v ? null : v; update(); });
  feeBox.append(b); return { v, b };
});
const feeOther = el("button", "btn num", "Other"); feeOther.type = "button";
feeOther.addEventListener("click", () => askNumber({ title: "Fee", onPick: v => { S.fee = v; update(); } }));
feeBox.append(feeOther);

const procBox = document.getElementById("procs"), procBtns = {};
PROCS.forEach(p => {
  const b = el("button", "btn", p.name); b.type = "button"; b.append(el("small", null, String(p.price)));
  const badge = el("span", "badge"); badge.hidden = true; b.append(badge);
  b.addEventListener("click", () => { S.qty[p.id] = (S.qty[p.id] || 0) + 1; update(); });
  procBox.append(b); procBtns[p.id] = { b, badge };
});
const otherBtn = el("button", "btn", "Other"); otherBtn.type = "button"; otherBtn.append(el("small", null, "Rs"));
const otherBadge = el("span", "badge"); otherBadge.hidden = true; otherBtn.append(otherBadge);
otherBtn.addEventListener("click", () => askNumber({ title: "Other amount", note: "New injection or anything not in the list.", onPick: v => { if (v > 0) { S.extras.push(v); update(); } } }));
procBox.append(otherBtn);

const discBox = document.getElementById("disc");
const discBtns = DISCOUNTS.map(d => {
  const b = el("button", "btn", d === 0 ? "None" : d + "%"); b.type = "button";
  b.addEventListener("click", () => { S.disc = d; S.override = null; update(); });
  discBox.append(b); return { d, b };
});

// ===== Medicines: one tap adds =====
function addMed(it) {
  if (it.perTab) {
    if (S.meds[it.id]) {
      // already added: let them change the tablet count
      const per = it.perTab.pack / it.perTab.size;
      askNumber({ title: it.name + ": how many tablets?", quick: it.perTab.quick.map(q => ({ label: `${q} tabs`, sub: "Rs " + fmt(Math.round(per * q)), value: q })),
        value: S.meds[it.id], onPick: v => { setMed(it.id, v); if (v > 0) { lastTabs[it.id] = v; store.set("cb-lasttabs", lastTabs); } } });
      return;
    }
    setMed(it.id, lastTabs[it.id] || it.perTab.quick[0]);
  } else setMed(it.id, (S.meds[it.id] || 0) + 1);
  usage[it.id] = (usage[it.id] || 0) + 1; store.set("cb-usage", usage);
}
function setMed(id, q) { if (q > 0) S.meds[id] = q; else delete S.meds[id]; update(); }

const tileSets = [];
function makeTile(it) {
  const tile = el("div", "tile");
  const b = el("button", "tile-main"); b.type = "button";
  const sub = el("span", "tile-sub");
  b.append(el("span", "tile-name", it.name), sub);
  b.addEventListener("click", () => addMed(it));
  const badge = el("span", "badge"); badge.hidden = true;
  const minus = el("button", "minus", "−"); minus.type = "button"; minus.hidden = true; minus.setAttribute("aria-label", "Remove one " + it.name);
  minus.addEventListener("click", () => setMed(it.id, it.perTab ? 0 : (S.meds[it.id] || 0) - 1));
  tile.append(b, badge, minus);
  const t = { tile, sub, badge, minus, it }; tileSets.push(t); return t;
}
const medsBox = document.getElementById("meds"), allTiles = {};
TABS.forEach(t => t.items.forEach(it => { const x = makeTile(it); allTiles[it.id] = x; medsBox.append(x.tile); }));

const topBox = document.getElementById("top-meds"), topEmpty = document.getElementById("top-empty");
const topTiles = {};
function renderTop() {
  // most-used order is fixed while a patient is being billed, so tiles don't jump under the finger
  const ids = Object.keys(usage).filter(id => ITEMS[id]).sort((a, b) => usage[b] - usage[a]).slice(0, TOP_COUNT);
  topEmpty.hidden = ids.length > 0;
  topBox.replaceChildren(...ids.map(id => { if (!topTiles[id]) topTiles[id] = makeTile(ITEMS[id]); return topTiles[id].tile; }));
}

const tabsBox = document.getElementById("tabs");
const tabBtns = TABS.map(t => {
  const b = el("button", "tab", t.title); b.type = "button"; b.setAttribute("role", "tab");
  b.addEventListener("click", () => { activeTab = t.key; store.set("cb-tab", t.key); showMeds(); });
  tabsBox.append(b); return { key: t.key, b };
});
const search = document.getElementById("search"), searchX = document.getElementById("search-x");
function showMeds() {
  const q = search.value.trim().toLowerCase().replace(/\s/g, "");
  searchX.hidden = !q; tabsBox.hidden = !!q;
  Object.values(allTiles).forEach(({ tile, it }) => { tile.hidden = q ? !it.name.toLowerCase().replace(/\s/g, "").includes(q) : it.tab !== activeTab; });
  tabBtns.forEach(({ key, b }) => { b.classList.toggle("on", key === activeTab); b.setAttribute("aria-selected", key === activeTab); });
}
search.addEventListener("input", showMeds);
searchX.addEventListener("click", () => { search.value = ""; showMeds(); search.focus(); });

// ===== Totals =====
function billLines() {
  const out = [];
  if (S.fee != null) out.push({ name: S.fee === 0 ? "Fee free" : "Fee", amt: S.fee, remove: () => { S.fee = null; } });
  PROCS.forEach(p => { const q = S.qty[p.id]; if (q) out.push({ name: p.name + (q > 1 ? ` ×${q}` : ""), amt: p.price * q, remove: () => { if (--S.qty[p.id] <= 0) delete S.qty[p.id]; } }); });
  Object.entries(S.meds).forEach(([id, q]) => {
    const it = ITEMS[id]; if (!it) return;
    out.push({ name: it.name + (it.perTab ? ` ${q}tab` : q > 1 ? ` ×${q}` : ""), amt: lineAmount(it, q), remove: () => { if (it.perTab || --S.meds[id] <= 0) delete S.meds[id]; } });
  });
  S.extras.forEach((v, i) => out.push({ name: "Other", amt: v, remove: () => S.extras.splice(i, 1) }));
  return out;
}
function totals() {
  const gross = billLines().reduce((s, l) => s + l.amt, 0);
  const off = Math.round(gross * S.disc / 100);
  const net = S.override != null ? S.override : Math.round((gross - off) / 10) * 10;
  return { gross, off, net };
}

const totalEl = document.getElementById("total"), codePill = document.getElementById("code-pill");
const discLine = document.getElementById("disc-line"), pickedEl = document.getElementById("picked");
let prevNet = 0;
function update() {
  document.getElementById("opd-num").textContent = opd.n;
  feeBtns.forEach(({ v, b }) => b.classList.toggle("on", S.fee === v));
  const custom = S.fee != null && !FEES.includes(S.fee);
  feeOther.classList.toggle("on", custom); feeOther.textContent = custom ? String(S.fee) : "Other";
  PROCS.forEach(p => { const q = S.qty[p.id] || 0, r = procBtns[p.id]; r.b.classList.toggle("on", q > 0); r.badge.hidden = q < 2; r.badge.textContent = "×" + q; });
  otherBtn.classList.toggle("on", S.extras.length > 0); otherBadge.hidden = S.extras.length < 2; otherBadge.textContent = "×" + S.extras.length;
  discBtns.forEach(({ d, b }) => b.classList.toggle("on", S.disc === d && d > 0));

  tileSets.forEach(({ tile, sub, badge, minus, it }) => {
    const q = S.meds[it.id] || 0;
    tile.classList.toggle("on", q > 0); minus.hidden = q === 0;
    badge.hidden = q === 0 || (!it.perTab && q === 1); badge.textContent = it.perTab ? q : "×" + q;
    sub.textContent = it.perTab ? (q ? `${q} tabs · ${fmt(lineAmount(it, q))}` : `${lastTabs[it.id] || it.perTab.quick[0]} tabs · ${fmt(lineAmount(it, lastTabs[it.id] || it.perTab.quick[0]))}`)
                                : (q > 1 ? fmt(lineAmount(it, q)) : String(it.price));
  });

  const { gross, off, net } = totals();
  totalEl.textContent = fmt(net);
  if (net !== prevNet) { totalEl.classList.remove("bump"); void totalEl.offsetWidth; totalEl.classList.add("bump"); prevNet = net; }
  codePill.hidden = net === 0; codePill.textContent = billCode(net);
  if (S.override != null) { discLine.hidden = false; discLine.textContent = `Typed amount (bill was ${fmt(gross)})`; }
  else if (S.disc > 0 && gross > 0) { discLine.hidden = false; discLine.textContent = `${fmt(gross)} − ${S.disc}% (${fmt(off)}) = you get ${fmt(net)}`; }
  else discLine.hidden = true;

  const lines = billLines();
  if (!lines.length) pickedEl.replaceChildren(el("span", "hint", "Tap fee, injection or medicine. Tap the total to type your own."));
  else pickedEl.replaceChildren(...lines.map(l => {
    const d = el("span", "pick");
    d.append(el("span", null, l.name), el("span", "amt", fmt(l.amt)));
    const x = el("button", null, "×"); x.type = "button"; x.setAttribute("aria-label", "Remove " + l.name);
    x.addEventListener("click", () => { l.remove(); update(); });
    d.append(x); return d;
  }));
  pickedEl.scrollLeft = pickedEl.scrollWidth;
  save();
}

// Tap the total to type your own final amount
document.getElementById("total-btn").addEventListener("click", () => {
  askNumber({ title: "Final amount to charge", note: "Tap a discount to go back to the worked-out amount.", value: totals().net || "", onPick: v => { S.override = v; update(); } });
});
document.getElementById("opd").addEventListener("click", () => askNumber({
  title: "Patient number", note: "Goes up by 1 on each New patient. Starts at 1 every day.", value: opd.n,
  onPick: v => { if (v > 0) { opd.n = v; update(); } },
}));

// ===== New patient + undo =====
const undoBar = document.getElementById("undo-bar"); let undoT;
document.getElementById("clear").addEventListener("click", () => {
  if (!billLines().length && S.override == null) return;
  lastCleared = JSON.parse(JSON.stringify({ S, n: opd.n }));
  S = blank(); opd.n += 1;
  search.value = ""; showMeds(); renderTop(); update(); window.scrollTo({ top: 0 });
  undoBar.hidden = false; clearTimeout(undoT); undoT = setTimeout(() => { undoBar.hidden = true; lastCleared = null; }, 8000);
});
document.getElementById("undo").addEventListener("click", () => {
  if (!lastCleared) return; S = lastCleared.S; opd.n = lastCleared.n; lastCleared = null; undoBar.hidden = true; update();
});

showMeds(); renderTop(); update();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
